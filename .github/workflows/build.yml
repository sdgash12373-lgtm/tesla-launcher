name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/CarLauncher-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CarLauncher-apk
          path: out/*.apk

      # Every push to main updates a "latest" release so the APK has a fixed download link.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版（自動編譯）
          prerelease: true
          make_latest: false
          files: out/*.apk
          body: |
            main 分支第 ${{ github.run_number }} 次自動編譯。
            下載 APK 後在車機上安裝即可。

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk

  # Renders the home screen at car-screen sizes (no emulator needed) and
  # pushes the PNGs to the "screenshots" branch for easy viewing.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: ./gradlew --no-daemon recordPaparazziDebug

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/src/test/snapshots/images/*.png

      - name: Push to screenshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir /tmp/shots && cp app/src/test/snapshots/images/*.png /tmp/shots/
          cd /tmp/shots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots
